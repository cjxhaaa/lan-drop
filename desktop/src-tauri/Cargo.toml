[package]
name = "filetransfer"
version = "1.3.0"
description = "电脑与安卓手机局域网互传文件"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "net", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
sha2 = "0.10"
getrandom = "0.3"
percent-encoding = "2"
mime_guess = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rfd = "0.15"
drag = "2"
trash = "5"
open = "5"
local-ip-address = "0.6"
winreg = "0.55"
base64 = "0.22"
arboard = { version = "3", default-features = false }
xcap = "0.9"
jpeg-encoder = { version = "0.6", features = ["simd"] }
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Shell", "Win32_Security", "Win32_System_Threading", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
